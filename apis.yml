aid: thrive-capital
name: Thrive Capital
description: >-
  Thrive Capital is a venture capital firm founded in 2009 by Joshua Kushner and headquartered in the
  Puck Building in New York City. The firm builds and invests in internet, software, and technology-enabled
  companies across the full lifecycle, from early-stage seed bets through growth and late-stage positions,
  and also incubates new companies through its Thrive Incubations program. Thrive concentrates its capital
  in a relatively small number of high-conviction positions across artificial intelligence, fintech,
  enterprise software, consumer internet, media and entertainment, healthcare, defense technology, and
  developer tools. The firm has scaled its funds steadily from a $5M first fund in 2009 to Thrive X, its
  tenth fund, which closed in early 2026 at over $10 billion (roughly $1B for early-stage and $9B for
  growth), bringing the firm to approximately $50 billion in assets under management. Nitin Nohria, the
  former dean of Harvard Business School, serves as executive chairman. Thrive is widely known as one of
  the earliest and most significant backers of OpenAI, Stripe, and SpaceX, and its portfolio includes
  Instagram, GitHub, Databricks, Ramp, Scale AI, Anduril, Robinhood, and Plaid.
